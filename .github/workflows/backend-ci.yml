
name: Backend CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx2 ruff

      - name: Проверить код Ruff
        run: ruff check backend

      - name: Проверить форматирование
        run: ruff format --check backend

      - name: Запустить тесты
        run: python -m pytest backend/tests/ -v

  database-checks:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: skillswipe-ci

    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Запустить PostgreSQL и применить миграции
        timeout-minutes: 5
        run: |
          cp .env.example .env
          docker compose up -d
          migration_container="$(docker compose ps -a -q migrate)"
          test -n "$migration_container"
          migration_exit="$(docker wait "$migration_container")"
          test "$migration_exit" = "0"

      - name: Проверить подключение FastAPI и результат миграции
        run: |
          python - <<'PY'
          import asyncio

          from backend.main import app


          async def check_database():
              async with app.router.lifespan_context(app):
                  pool = app.state.db_pool
                  assert await pool.fetchval("SELECT current_schema()") == "skillswipe"
                  assert await pool.fetchval(
                      "SELECT EXISTS (SELECT 1 FROM public.databasechangelog WHERE tag = $1)",
                      "SSK-2",
                  )


          asyncio.run(check_database())
          PY

      - name: Показать логи при сбое
        if: failure()
        run: docker compose logs --no-color postgres migrate

      - name: Удалить тестовые контейнеры и том
        if: always()
        run: docker compose down -v
