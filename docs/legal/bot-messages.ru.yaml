# Сообщения бота SkillSwipe для онбординга (MVP), язык: ru
# Версия словаря: 0.2 (черновик), дата: 2026-11-27. Задача: SSK-17.
#
# Формат: плоские ключи, плейсхолдеры {name} подставляются через str.format.
# Разметка Telegram: HTML (parse_mode=HTML), допустимы <b>, <i>, <a>.
# Ссылки на согласие и политику задаются адресами кнопок в конфигурации
# (consent_url, policy_url), в тексты они не вставляются.
#
# Плейсхолдеры, которые подставляет backend из конфигурации:
#   {operator_name}, {operator_email}, {hosting_provider}  реквизиты (решения D2, D3)
#   {llm_provider_name}, {llm_provider_country}            провайдер ИИ-сервиса и его страна (решение D4)
#   {doc_version}                                          версия согласия из docs/legal
#   {mode_name}                                            название выбранного режима
#
# Тексты описывают целевое состояние ближайшей версии: навыки определяет ML-1 по резюме или описанию
# (ручного выбора нет), ленты, мэтчей и чата пока нет. Публиковать можно, когда функции реализованы.
# Когда появятся лента, мэтчи и чат, нужны новая версия согласия и новые сообщения.
# Ключи не менять без согласования с аналитиком (от них зависят тесты).

# ---------- Старт ----------
onboarding.start.welcome: |-
  👋 Привет! Это <b>SkillSwipe</b>: сервис, который помогает экспертам и основателям стартапов находить друг друга по навыкам.

  Чтобы продолжить, нужно ваше согласие на обработку персональных данных. Это займёт минуту.
onboarding.start.button_continue: "Продолжить"
onboarding.start.welcome_back: "👋 С возвращением!"

# ---------- Согласие core (отдельное сообщение, ничего больше в него не добавляем) ----------
onboarding.consent.text: |-
  📋 <b>Согласие на обработку персональных данных</b>

  <b>Оператор:</b> {operator_name}, {operator_email}.
  <b>Что обрабатываем:</b> ваш Telegram ID, имя пользователя (username) в Telegram, язык интерфейса, выбранный режим и навыки, которые определяются по вашему резюме или описанию (для этого понадобится отдельное согласие).
  <b>Зачем:</b> создать аккаунт и профиль и работать с сервисом SkillSwipe.
  <b>Что делаем:</b> собираем, храним, используем, удаляем.
  <b>Кому передаём:</b> хостинг-провайдеру ({hosting_provider}) для хранения данных. Больше никому.
  <b>Срок:</b> пока вы пользуетесь сервисом. После удаления аккаунта или отзыва согласия удалим данные в течение 30 дней.
  <b>Отзыв:</b> в любой момент в «Меню → Мои данные» или письмом на {operator_email}.

  Нажимая «Согласен(на)», вы подтверждаете, что вам не менее 18 лет, и даёте согласие на обработку данных, как описано выше. Версия документа: {doc_version}.
onboarding.consent.button_accept: "✅ Согласен(на)"
onboarding.consent.button_decline: "❌ Не согласен(на)"
onboarding.consent.button_full_text: "📄 Полный текст согласия"
onboarding.consent.button_policy: "🔒 Политика конфиденциальности"
onboarding.consent.accepted: |-
  Спасибо, согласие сохранено ✅ Его можно отозвать в любой момент: «Меню → Мои данные».

  Что вы ищете?
onboarding.consent.declined: |-
  Понимаем. Без согласия мы не можем создать аккаунт. Мы ничего о вас не сохранили. Если передумаете, отправьте /start.

# ---------- Согласие llm_processing (при первой отправке текста на определение навыков) ----------
llm.consent.text: |-
  🤖 <b>Определение навыков с помощью ИИ</b>

  Чтобы определить ваши навыки, текст вашего резюме или описания будет передан ИИ-сервису: {llm_provider_name} ({llm_provider_country}). Перед отправкой мы скрываем телефон, email, ссылки и ФИО. Файл и текст мы не сохраняем, сохраняются только найденные навыки.

  Без этого согласия навыки определить нельзя. Отозвать согласие можно, удалив аккаунт в «Меню → Мои данные», или письмом на {operator_email}. Версия документа: {doc_version}.
llm.consent.button_accept: "✅ Разрешить"
llm.consent.button_decline: "❌ Не разрешать"
llm.consent.button_full_text: "📄 Полный текст согласия"
llm.consent.accepted: "Спасибо, согласие сохранено ✅ Определяю навыки…"
llm.consent.declined: |-
  Понимаем. Без этого мы не сможем определить ваши навыки. Вернуться к этому можно в любой момент: отправьте резюме или описание снова.

# ---------- Режим ----------
onboarding.mode.choose: "Что вы ищете?"
mode.expert: "🔎 Ищу проект"
mode.owner: "🧑‍💻 Ищу экспертов"
onboarding.mode.saved: "Режим сохранён: <b>{mode_name}</b>. Его можно сменить в меню."

# ---------- Главное меню и справка ----------
menu.main: "🏠 <b>Главное меню.</b> Ваш режим: «{mode_name}»."
menu.button_open_app: "🚀 Открыть SkillSwipe"
menu.button_change_mode: "🔄 Сменить режим"
menu.button_help: "ℹ️ Справка"
menu.button_my_data: "🔒 Мои данные"
menu.help: |-
  <b>SkillSwipe</b> помогает экспертам и основателям стартапов находить друг друга по навыкам.

  • «Открыть SkillSwipe» открывает приложение.
  • «Сменить режим» переключает между «Ищу проект» и «Ищу экспертов».
  • «Мои данные» объясняет, как мы обрабатываем данные, и позволяет удалить аккаунт.

  Вопросы: {operator_email}.

# ---------- Мои данные ----------
mydata.text: |-
  Здесь вы управляете своими данными. Подробнее о том, как мы их обрабатываем, в политике конфиденциальности.
mydata.button_policy: "🔒 Политика конфиденциальности"
mydata.button_delete: "🗑 Отозвать согласие и удалить аккаунт"

# ---------- Удаление аккаунта (отзыв согласия core равен удалению) ----------
delete.confirm: |-
  Отзыв согласия означает удаление аккаунта. Мы удалим профиль, навыки и согласия в течение 30 дней. Продолжить?
delete.button_confirm: "Да, удалить"
delete.button_cancel: "Отмена"
delete.done: |-
  Аккаунт удалён, согласие отозвано. Если захотите вернуться, отправьте /start.
delete.cancelled: "Хорошо, ничего не удаляем."

# ---------- Проверка согласия (бот, Mini App, API) ----------
gate.no_consent: |-
  Чтобы пользоваться SkillSwipe, нужно согласие на обработку персональных данных. Отправьте /start, чтобы дать согласие.

# ---------- Общие ----------
common.error: "Что-то пошло не так. Попробуйте ещё раз позже."
common.unknown: "Не понял. Воспользуйтесь кнопками меню или отправьте /start."
